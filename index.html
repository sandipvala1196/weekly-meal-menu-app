<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealCraft - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#f97316', 600: '#ea580c' }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden font-sans">

    <!-- Background Overlay -->
    <div class="fixed inset-0 bg-[url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-25 -z-20"></div>
    <div class="fixed inset-0 bg-gradient-to-tr from-slate-950 via-slate-900/90 to-slate-950/80 -z-10"></div>

    <canvas id="bgCanvas" class="fixed inset-0 pointer-events-none -z-5"></canvas>

    <button id="themeToggle" class="fixed top-5 right-5 w-11 h-11 rounded-full glass-card flex items-center justify-center text-slate-200 hover:text-amber-400 transition-all z-50">
        <i class="fa-solid fa-moon text-lg"></i>
    </button>

    <main class="w-full max-w-md glass-card rounded-3xl p-8 shadow-2xl relative border border-white/10 my-8">
        
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-600 text-white shadow-lg mb-3">
                <i class="fa-solid fa-utensils text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">MealCraft</h1>
            <p class="text-xs text-slate-400 mt-1">Weekly Food Planner</p>
        </div>

        <!-- Auth Tabs -->
        <div class="flex bg-slate-900/60 p-1 rounded-xl mb-6 border border-white/5">
            <button id="tabLogin" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-lg text-xs font-semibold transition bg-amber-500 text-white shadow">
                Sign In
            </button>
            <button id="tabRegister" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
                Register
            </button>
        </div>

        <!-- 1. LOGIN FORM -->
        <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username / Email</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="loginUser" required placeholder="Enter username or email" class="w-full bg-slate-900/60 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-900/60 border border-white/10 rounded-xl py-3 pl-11 pr-11 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                    <button type="button" onclick="togglePassword('loginPassword', 'loginEye')" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-200">
                        <i id="loginEye" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-orange-500/20 transition-all flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- 2. REGISTER FORM -->
        <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
                <div class="relative">
                    <i class="fa-regular fa-id-card absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="regName" required placeholder="Your Name" class="w-full bg-slate-900/60 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username / Email</label>
                <div class="relative">
                    <i class="fa-solid fa-user-tag absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="regUser" required placeholder="Choose a username" class="w-full bg-slate-900/60 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Create Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="password" id="regPassword" required placeholder="••••••••" class="w-full bg-slate-900/60 border border-white/10 rounded-xl py-3 pl-11 pr-11 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
                    <button type="button" onclick="togglePassword('regPassword', 'regEye')" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-200">
                        <i id="regEye" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-orange-500/20 transition-all flex items-center justify-center gap-2">
                <span>Create Account</span>
                <i class="fa-solid fa-user-plus text-xs"></i>
            </button>
        </form>

    </main>

    <script src="app.js"></script>
</body>
</html>
